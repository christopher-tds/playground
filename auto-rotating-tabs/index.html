<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Auto-Rotating Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@350;400;500&family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
  /* Design tokens. Component type uses Hanken Grotesk / IBM Plex Mono; prototype chrome uses Inter */
  :root {
    --color-text-primary: #2c2a26;
    --color-text-muted: #6f6b64;
    --color-border-default: #dcdcdc;
    --color-surface: #ffffff;
    --color-canvas: #ecebe8;
    --color-media: #efeeeb;
    --type-sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --type-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --type-ui: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --slide-ms: 6000;
    --focus-ms: 900ms;
    --ease-focus: cubic-bezier(.22, .61, .36, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--color-canvas);
    color: var(--color-text-primary);
    font-family: var(--type-sans);
    font-weight: 400;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Prototype chrome ---------- */
  .shell { font-family: var(--type-ui); padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
    max-width: 1440px; width: 100%; margin-inline: auto;
  }
  .bar__id { display: flex; flex-direction: column; gap: 2px; }
  .bar__eyebrow { font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
  .bar__title { font-size: 17px; font-weight: 500; }
  .bar__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: #dddbd6; border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; color: var(--color-text-muted);
  }
  .seg button[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text-primary); box-shadow: 0 1px 2px rgba(44,42,38,.12); }
  .seg svg, .ghost svg { width: 15px; height: 15px; }
  .ghost {
    border: 1px solid #cfccc6; background: transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px;
  }
  .ghost:hover, .seg button:hover { color: var(--color-text-primary); }
  button:focus-visible { outline: 2px solid var(--color-text-primary); outline-offset: 2px; }

  .stage { width: 100%; max-width: 1440px; margin-inline: auto; display: flex; justify-content: center; }
  .frame { background: var(--color-surface); border-radius: 10px; box-shadow: 0 1px 2px rgba(44,42,38,.06), 0 12px 40px -12px rgba(44,42,38,.18); overflow: hidden; }
  .frame--desktop { width: 100%; }
  .frame--desktop .scaler { width: 1440px; transform-origin: 0 0; }
  .frame--mobile { width: 390px; max-width: 100%; height: min(844px, 78vh); border-radius: 28px; border: 8px solid #1d1c1a; }
  .frame--mobile .scaler { width: 100%; height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .frame--mobile .scaler::-webkit-scrollbar { display: none; }
  .note { text-align: center; font-size: 12.5px; color: var(--color-text-muted); max-width: 60ch; margin-inline: auto; line-height: 1.5; }

  /* ---------- Component ---------- */
  .kf { font-family: var(--type-sans); container-type: inline-size; background: var(--color-surface); }
  .kf__mobile { display: none; }

  /* lg / carousel — 1440 × 760, 24 padding, two 684 columns */
  .kf__desktop { display: flex; gap: 24px; padding: 24px; height: 760px; }
  .kf__panel { flex: 0 0 684px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 40px; }
  .kf__eyebrow {
    margin: 0; font-family: var(--type-mono); font-weight: 700; font-size: 24px; line-height: 24px;
    letter-spacing: .2em; text-transform: uppercase;
  }
  .kf__list { width: 440px; display: flex; flex-direction: column; }
  .kf__row {
    position: relative; display: flex; flex-direction: column; width: 100%; text-align: left;
    padding-block: 24px; border: 0; border-bottom: 1px solid var(--color-border-default); background: none; cursor: pointer;
  }
  .kf__row:first-child { border-top: 1px solid var(--color-border-default); }
  .kf__title { font-size: 20px; line-height: 28px; font-weight: 400; opacity: .24; transition: opacity .35s ease; }
  .kf__row:hover .kf__title { opacity: .55; }
  .kf__row.is-active .kf__title { opacity: 1; }
  .kf__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease-focus); }
  .kf__row.is-active .kf__body { grid-template-rows: 1fr; }
  .kf__body > div { overflow: hidden; }
  .kf__desc {
    margin: 0; padding-top: 8px; font-size: 16px; line-height: 24px; font-weight: 350;
    opacity: 0; transform: translateY(4px); transition: opacity .35s ease, transform .5s var(--ease-focus);
  }
  .kf__row.is-active .kf__desc { opacity: 1; transform: none; transition-delay: .12s; }
  .kf__timer { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; overflow: hidden; pointer-events: none; }
  .kf__timer i { display: block; height: 100%; background: var(--color-text-primary); transform: scaleX(0); transform-origin: left; will-change: transform; }

  .kf__media { flex: 0 0 684px; position: relative; overflow: hidden; border-radius: 8px; background: var(--color-media); }
  .kf__control {
    position: absolute; right: 16px; bottom: 16px; z-index: 3;
    width: 48px; height: 48px; border: 0; border-radius: 999px; padding: 12px;
    background: var(--color-surface); color: var(--color-text-primary); cursor: pointer;
    display: grid; place-items: center;
  }
  .kf__control svg { width: 24px; height: 24px; display: block; }
  .kf__slide {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; filter: blur(18px);
    transition: opacity var(--focus-ms) var(--ease-focus), filter var(--focus-ms) var(--ease-focus);
  }
  .kf__slide.is-active { opacity: 1; filter: blur(0); z-index: 1; }
  .kf__slide.is-leaving { opacity: 0; filter: blur(18px); z-index: 2; transition-duration: calc(var(--focus-ms) * .75); }

  /* sm / carousel — stacked, 16 gutter, 32 gaps */
  @container (max-width: 700px) {
    .kf__desktop { display: none; }
    .kf__mobile { display: flex; flex-direction: column; gap: 32px; padding: 32px 16px; }
    .kf__heading {
      margin: 0; font-family: var(--type-mono); font-weight: 700; font-size: 24px; line-height: 24px;
      letter-spacing: .2em; text-transform: uppercase;
    }
    .kf__card { display: flex; flex-direction: column; gap: 16px; }
    .kf__card-media { height: 320px; border-radius: 8px; overflow: hidden; background: var(--color-media); }
    .kf__card-media img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity var(--focus-ms) var(--ease-focus), filter var(--focus-ms) var(--ease-focus);
    }
    .kf.js .kf__card:not(.is-seen) .kf__card-media img { opacity: .4; filter: blur(14px); }
    .kf__card-text { display: flex; flex-direction: column; gap: 8px; }
    .kf__card-title { margin: 0; font-size: 16px; line-height: 28px; font-weight: 400; }
    .kf__card-desc { margin: 0; font-size: 16px; line-height: 24px; font-weight: 350; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kf__slide, .kf__slide.is-leaving { filter: none !important; }
    .kf.js .kf__card:not(.is-seen) .kf__card-media img { filter: none; opacity: 1; }
    .kf__body, .kf__desc { transition: none; }
  }
</style>

<div class="shell">
  <header class="bar">
    <div class="bar__id">
      <span class="bar__eyebrow">PDP prototype</span>
      <span class="bar__title">Auto-rotating tabs</span>
    </div>
    <div class="bar__controls">
      <div class="seg" role="group" aria-label="Viewport">
        <button type="button" id="view-desktop" data-view="desktop" aria-pressed="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 13.5h5M8 11v2.5"/></svg>Desktop
        </button>
        <button type="button" id="view-mobile" data-view="mobile" aria-pressed="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4.5" y="1.5" width="7" height="13" rx="1.5"/><path d="M7 12.5h2"/></svg>Mobile
        </button>
      </div>
    </div>
  </header>

  <div class="stage">
    <div class="frame frame--desktop" id="frame">
      <div class="scaler" id="scaler">
        <section class="kf" id="kf" aria-label="Key features">
          <div class="kf__desktop">
            <div class="kf__panel">
              <h2 class="kf__eyebrow">Key Features</h2>
              <div class="kf__list" id="kf-list" role="tablist" aria-orientation="vertical"></div>
            </div>
            <div class="kf__media" id="kf-media">
              <button type="button" class="kf__control" id="play-toggle" aria-label="Pause carousel">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="play-icon"><path d="M4.5 3h5v18h-5zM14.5 3h5v18h-5z"/></svg>
              </button>
            </div>
          </div>
          <div class="kf__mobile" id="kf-mobile">
            <h2 class="kf__heading">Key Features</h2>
          </div>
        </section>
      </div>
    </div>
  </div>

  <p class="note" id="note">Each feature holds for 6 seconds. The line under the open row is the timer. Click a row to jump to it; the timer keeps running from there.</p>
</div>

<script>
(() => {
  const FEATURES = [
    { title: "MagFit™-enable for a gap-free fit", desc: "Ensures perfect alignment with the helmet vents to prevent fogging, and prevents vibration and shifting while skiing.", img: "assets/feature-1.jpg", pos: "50% 14%", alt: "Skier in a helmet and mirrored goggles holding a snowboard" },
    { title: "Reveal® 4K contrast-enhancing lens tech", desc: "Next-generation optics that sharpen detail and boost contrast, giving you clearer vision in flat light conditions.", img: "assets/feature-2.jpg", pos: "60% 40%", alt: "Rider in a pale jacket shielding their face in bright sun" },
    { title: "Anti-fog ventilation system", desc: "Engineered airflow channels and premium coatings that keep your lenses clear through heavy exertion and variable weather.", img: "assets/feature-3.jpg", pos: "50% 35%", alt: "Snowboarder in black with blue-tinted goggles and a lime board" },
    { title: "Impact-resistant durability", desc: "Scratch- and shatter-resistant lenses paired with flexible frames built to withstand the demands of mountain conditions.", img: "assets/feature-4.jpg", pos: "50% 17%", alt: "Close-up of a helmet with orange-strapped goggles" },
    { title: "Helmet compatibility & comfort fit", desc: "Designed for seamless integration with ski helmets, featuring triple-layer face foam for all-day comfort and a secure fog-free fit.", img: "assets/feature-5.jpg", pos: "50% 26%", alt: "Skier in a white helmet and goggles holding a patterned board" },
  ];
  const SLIDE_MS = 6000;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const kf = document.getElementById("kf");
  const list = document.getElementById("kf-list");
  const media = document.getElementById("kf-media");
  const mobile = document.getElementById("kf-mobile");
  kf.classList.add("js");

  const rows = [], slides = [], bars = [];
  FEATURES.forEach((f, i) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "kf__row";
    row.id = "kf-tab-" + i;
    row.setAttribute("role", "tab");
    row.setAttribute("aria-controls", "kf-media");
    row.innerHTML = `<span class="kf__title"></span><span class="kf__body"><div><p class="kf__desc"></p></div></span><span class="kf__timer" aria-hidden="true"><i></i></span>`;
    row.querySelector(".kf__title").textContent = f.title;
    row.querySelector(".kf__desc").textContent = f.desc;
    row.addEventListener("click", () => { go(i); });
    list.appendChild(row);
    rows.push(row);
    bars.push(row.querySelector(".kf__timer i"));

    const img = new Image();
    img.className = "kf__slide";
    img.src = f.img; img.alt = f.alt; img.style.objectPosition = f.pos;
    img.decoding = "async";
    media.appendChild(img);
    slides.push(img);

    const card = document.createElement("article");
    card.className = "kf__card";
    card.innerHTML = `<div class="kf__card-media"><img alt="" loading="lazy" decoding="async"></div><div class="kf__card-text"><h3 class="kf__card-title"></h3><p class="kf__card-desc"></p></div>`;
    const cimg = card.querySelector("img");
    cimg.src = f.img; cimg.alt = f.alt; cimg.style.objectPosition = f.pos;
    card.querySelector(".kf__card-title").textContent = f.title;
    card.querySelector(".kf__card-desc").textContent = f.desc;
    mobile.appendChild(card);
  });

  /* ---------- Desktop autoplay ---------- */
  let active = -1, elapsed = 0, last = 0;
  let userPaused = false, offscreen = false;
  const running = () => !userPaused && !offscreen && !document.hidden && view === "desktop";

  function go(i) {
    if (i === active) { elapsed = 0; return; }
    const prev = active;
    active = i; elapsed = 0;
    rows.forEach((r, n) => {
      r.classList.toggle("is-active", n === i);
      r.setAttribute("aria-selected", n === i);
      r.tabIndex = n === i ? 0 : -1;
    });
    bars.forEach(b => (b.style.transform = "scaleX(0)"));
    slides.forEach((s, n) => s.classList.remove("is-leaving"));
    if (prev > -1) {
      slides[prev].classList.remove("is-active");
      if (!reduceMotion) {
        slides[prev].classList.add("is-leaving");
        setTimeout(() => slides[prev].classList.remove("is-leaving"), 900);
      }
    }
    slides[i].classList.add("is-active");
  }

  function tick(now) {
    const dt = last ? now - last : 0;
    last = now;
    if (running()) {
      elapsed += dt;
      if (elapsed >= SLIDE_MS) go((active + 1) % FEATURES.length);
      bars[active].style.transform = `scaleX(${Math.min(elapsed / SLIDE_MS, 1)})`;
    }
    requestAnimationFrame(tick);
  }

  list.addEventListener("keydown", e => {
    const k = e.key;
    if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(k)) return;
    e.preventDefault();
    const n = FEATURES.length;
    const next = k === "Home" ? 0 : k === "End" ? n - 1 : (active + (k === "ArrowDown" ? 1 : -1) + n) % n;
    go(next); rows[next].focus();
  });

  const desktop = kf.querySelector(".kf__desktop");
  new IntersectionObserver(([en]) => { offscreen = !en.isIntersecting; }, { threshold: .25 }).observe(desktop);

  const playBtn = document.getElementById("play-toggle");
  const playIcon = document.getElementById("play-icon");
  playBtn.addEventListener("click", () => {
    userPaused = !userPaused;
    playBtn.setAttribute("aria-label", userPaused ? "Play carousel" : "Pause carousel");
    playIcon.innerHTML = userPaused
      ? '<path d="M22 12a1.37 1.37 0 0 1-.65 1.17L9.07 20.8a1.37 1.37 0 0 1-2.07-1.17V4.37A1.37 1.37 0 0 1 9.07 3.2l12.28 7.63A1.37 1.37 0 0 1 22 12z"/>'
      : '<path d="M4.5 3h5v18h-5zM14.5 3h5v18h-5z"/>';
  });

  /* ---------- Mobile: images focus in as they scroll into view ---------- */
  const scaler = document.getElementById("scaler");
  const cardObserver = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("is-seen"); cardObserver.unobserve(en.target); } });
  }, { root: scaler, threshold: .35 });

  /* ---------- Viewport toggle ---------- */
  const frame = document.getElementById("frame");
  const note = document.getElementById("note");
  const viewBtns = [...document.querySelectorAll("[data-view]")];
  let view = "desktop";

  function fit() {
    if (view !== "desktop") return;
    const s = Math.min(1, frame.clientWidth / 1440);
    scaler.style.transform = `scale(${s})`;
    frame.style.height = 760 * s + "px";
  }

  function setView(v) {
    view = v;
    viewBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
    frame.className = "frame frame--" + v;
    if (v === "desktop") {
      fit();
      note.textContent = "Each feature holds for 6 seconds. The line under the open row is the timer. Click a row to jump to it; the timer keeps running from there.";
    } else {
      scaler.style.transform = ""; frame.style.height = "";
      scaler.scrollTop = 0;
      kf.querySelectorAll(".kf__card").forEach(c => { c.classList.remove("is-seen"); cardObserver.observe(c); });
      note.textContent = "Mobile stacks all five features, following the sm frame. Scroll inside the phone; each image comes into focus as it enters view.";
    }
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
  }

  viewBtns.forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  addEventListener("resize", fit);
  document.addEventListener("visibilitychange", () => { last = 0; });

  go(0);
  setView(location.hash === "#mobile" ? "mobile" : "desktop");
  requestAnimationFrame(tick);
})();
</script>

</body></html>
