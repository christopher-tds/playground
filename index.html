<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Same palette and type as the exploration preview pages */
  :root { --ui-text: #2c2a26; --ui-muted: #6f6b64; --ui-canvas: #ecebe8; color-scheme: light; }
  body { margin: 0; padding: 120px 16px 64px 120px; max-width: 40rem; background: var(--ui-canvas); color: var(--ui-text); font: 400 15px/1.6 "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 4px; }
  p { color: var(--ui-muted); margin: 0 0 24px; }
  h2 { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-muted); margin: 32px 0 8px; }
  ul { padding-left: 20px; margin: 0; }
  a { color: var(--ui-text); text-underline-offset: 3px; text-decoration-color: #aeaaa2; }
  a:hover { text-decoration-color: currentColor; }
  @media (max-width: 640px) { body { padding: 48px 16px; } }
  a:focus-visible { outline: 2px solid var(--ui-text); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Playground</h1>
<p>Design explorations. One folder per exploration.</p>

</ul>

</ul>
