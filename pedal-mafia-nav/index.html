<html lang="en">
<head>
<meta charset="utf-8">

<title>Pedal Mafia Nav</title>

<style>
  /* ---------- Preview page only (not part of the component) ---------- */
  :root {
    --ui-text: #2c2a26;
    --ui-muted: #6f6b64;
    --ui-surface: #ffffff;
    --ui-canvas: #ecebe8;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ui-canvas); color: var(--ui-text); font: 400 14px "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  button { font: inherit; color: inherit; }

  .shell { padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; max-width: 1440px; width: 100%; margin-inline: auto; }
  .bar__id { display: flex; flex-direction: column; gap: 2px; }
  .bar__eyebrow { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-muted); text-decoration: none; }
  .bar__eyebrow svg { width: 12px; height: 12px; }
  .bar__eyebrow:hover { color: var(--ui-text); }
  .bar__eyebrow:focus-visible { outline: 2px solid var(--ui-text); outline-offset: 2px; }
  .bar__title { font-size: 17px; font-weight: 500; }
  .bar__controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: #dddbd6; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; color: var(--ui-muted); }
  .seg button[aria-pressed="true"] { background: var(--ui-surface); color: var(--ui-text); box-shadow: 0 1px 2px rgba(44,42,38,.12); }
  .seg button:hover { color: var(--ui-text); }
  .seg button:focus-visible { outline: 2px solid var(--ui-text); outline-offset: 2px; }

  .stage { width: 100%; max-width: 1440px; margin-inline: auto; }
  .frame { background: var(--ui-surface); box-shadow: 0 1px 2px rgba(44,42,38,.06), 0 12px 40px -12px rgba(44,42,38,.18); overflow: hidden; width: 100%; }
  .frame .scaler { width: 1440px; transform-origin: 0 0; }
  .note { text-align: center; font-size: 12.5px; color: var(--ui-muted); max-width: 60ch; margin-inline: auto; line-height: 1.5; }

  /* ---------- Pedal Mafia desktop header, recreated ----------
     Measured from usa.pedalmafia.cc at 1440px and td-section-header.css.
     ABC Whyte is licensed, so Inter stands in. */
  .pm-header {
    display: grid;
    grid-template-columns: 160px 1fr 220px;   /* PM: logo 160, menu, icons 220 */
    column-gap: 20px;
    align-items: center;
    height: 62px;
    padding: 0 20px;
    background: #fff;
    border-bottom: 1px solid #f2f2f2;
    position: relative;
    z-index: 1;
    color: #000;
    font-family: "Inter", sans-serif;
  }
  /* Stand-in for the page under the header; PM's live bar hangs 3px below it */
  .pm-page { height: 120px; background: #f5f5f4; }
  .pm-header a { color: inherit; text-decoration: none; }
  .pm-header__logo { display: block; line-height: 0; }
  .pm-header__logo img { width: 160px; height: auto; }
  .pm-header__menu { display: flex; justify-content: center; height: 62px; margin: 0; padding: 0; list-style: none; }
  .pm-header__item {
    position: relative;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 10px;                        /* PM: 10px each side, so labels sit 20px apart */
    font-size: 14px;
    line-height: 14px;
    text-transform: uppercase;
  }
  .pm-header__item span { display: block; }
  .pm-header__icons { display: flex; align-items: center; justify-content: flex-end; }
  .pm-header__corner { display: block; padding: 0 5px; font-size: 14px; line-height: 14px; letter-spacing: .6px; text-transform: uppercase; }
  .pm-header__icon { display: grid; place-items: center; width: 35px; height: 41px; padding: 0; border: 0; background: none; cursor: pointer; }
  .pm-header__icon svg { width: 21px; height: 20px; }
  .pm-header :focus-visible { outline: 2px solid #000; outline-offset: -2px; }

  /* "Current" mode: PM's live hover, a 2px bar under the whole item that fades in */
  .pm-header--current .nav-hover::after { display: none; }
  .pm-header--current .pm-header__item::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #000;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .pm-header--current .pm-header__item:hover::after { opacity: 1; }
</style>
</head>

<script type="application/json" id="dev-files">
[
  { "label": "Overview", "path": "README.md" },
  { "label": "PM header CSS", "path": "shopify/td-section-header-hover.css", "dest": "src/assets/td-section-header.css" },
  { "label": "Generic CSS", "path": "component/nav-link-hover.css" }
]
</script>

<script>
/* Preview page only: hover toggle, and scaling the 1440px header to fit the window. */
(() => {
  const frame = document.getElementById("frame");
  const scaler = document.getElementById("scaler");
  const header = document.getElementById("pm-header");
  const note = document.getElementById("note");
  const buttons = [...document.querySelectorAll("[data-hover]")];
  const NOTES = {
    jacquemus: "Hover a menu item, About or Help: a 1px line draws in from the left and leaves to the right. Tab through for the focus state.",
    current: "What's live today: a 2px bar under the whole menu item fades in, sitting on the header's bottom edge."
  };

  function fit() {
    const s = Math.min(1, frame.clientWidth / 1440);
    scaler.style.transform = `scale(${s})`;
    frame.style.height = scaler.offsetHeight * s + "px";
  }

  function setHover(v) {
    buttons.forEach(b => b.setAttribute("aria-pressed", b.dataset.hover === v));
    header.classList.toggle("pm-header--current", v === "current");
    note.textContent = NOTES[v];
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
  }

  buttons.forEach(b => b.addEventListener("click", () => setHover(b.dataset.hover)));
  addEventListener("resize", fit);
  new ResizeObserver(fit).observe(scaler);
  fit();
  setHover(location.hash === "#current" ? "current" : "jacquemus");
})();
</script>
